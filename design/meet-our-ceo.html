<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meet Our CEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens from the Hustle Academy Social design system (dark theme). */
  :root {
    --surface: #0a3c48;
    --surface-glow: #0d4c59;
    --surface-deep: #052a33;
    --surface-light: #ebf5f7;
    --ink: #ffffff;
    --ink-muted: #a9c3ca;
    --border: #114c58;
    --accent: #f5c13a;
    --brand-teal: #08808e;
    --ink-light: #0b3b4a;
    --display: Fraunces, Georgia, serif;
    --body: Inter, ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--surface-deep); }

  .post {
    position: relative;
    width: 1080px;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--body);
    background:
      radial-gradient(ellipse 80% 45% at 50% 0%, var(--surface-glow) 0%, rgba(13, 76, 89, 0) 100%),
      linear-gradient(180deg, var(--surface-glow) 0%, var(--surface) 50%, var(--surface-deep) 100%);
  }
  .story { height: 1920px; }
  .feed { height: 1350px; }

  /* Header: badge logo + wordmark */
  .header {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 28px;
  }
  .header img { width: 88px; height: 88px; border-radius: 50%; display: block; }
  .wordmark { font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 6px; text-transform: uppercase; }

  /* Title block */
  .title { position: absolute; left: 0; right: 0; text-align: center; }
  .hook {
    font-family: var(--display); font-weight: 900; font-variation-settings: "opsz" 9;
    text-transform: uppercase; line-height: 0.96;
  }
  .hook .lead { display: block; color: var(--ink); }
  .hook .big { display: block; color: var(--accent); line-height: 0.84; }
  .role {
    display: inline-flex; align-items: center; gap: 18px;
    height: 76px; padding: 0 36px; border-radius: 9999px;
    border: 2px solid rgba(255, 255, 255, 0.55);
    background: rgba(255, 255, 255, 0.07);
    font-weight: 700; font-size: 30px; letter-spacing: 6px; text-transform: uppercase;
  }
  .role .and { color: var(--accent); }

  /* Person sticker (outline baked into the PNG) */
  .person { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: block; }

  /* Floating stickers */
  .sticker {
    position: absolute; z-index: 2;
    display: grid; place-items: center;
    background: var(--surface-light);
    border-radius: 34px;
    box-shadow: 0 0 0 14px rgba(235, 245, 247, 0.22), 0 24px 40px -22px rgba(0, 0, 0, 0.55);
    color: var(--brand-teal);
  }
  .sticker svg { width: 64%; height: 64%; overflow: visible; }
  .sticker svg * { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .sticker svg .fill-accent { fill: var(--accent); }
  .sticker svg .fill-teal { fill: var(--brand-teal); }
  .sticker svg .fill-surface { fill: var(--surface); }
  .sticker svg .fill-light { fill: #ffffff; }

  /* Bottom fade + button */
  .fade { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(5, 42, 51, 0) 0%, rgba(5, 42, 51, 0.92) 100%); }
  .button {
    position: absolute; z-index: 3; left: 64px; right: 64px; height: 104px; border-radius: 9999px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    font-weight: 800; font-size: 40px; letter-spacing: -1.2px;
  }
  .button.solid { background: #ffffff; color: var(--ink-light); }
  .button.ghost { border: 2px solid rgba(255, 255, 255, 0.85); color: #ffffff; background: rgba(5, 42, 51, 0.6); }
  .button svg { width: 40px; height: 40px; }
  .button svg path { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Story 1080x1920 ---- */
  .story .header { top: 210px; }
  .story .title { top: 352px; }
  .story .hook .lead { font-size: 112px; letter-spacing: 2px; }
  .story .hook .big { font-size: 330px; margin-top: 4px; }
  .story .role { margin-top: 26px; }
  .story .fade { height: 420px; }
  .story .button { bottom: 340px; left: 250px; right: 250px; font-size: 34px; height: 92px; }

  /* ---- Feed 1080x1350 ---- */
  .feed .header { top: 56px; }
  .feed .title { top: 178px; }
  .feed .hook .lead { font-size: 84px; letter-spacing: 2px; }
  .feed .hook .big { font-size: 236px; margin-top: 2px; }
  .feed .role { margin-top: 18px; height: 68px; font-size: 26px; padding: 0 30px; }
  .feed .fade { height: 300px; }
  .feed .button { bottom: 66px; }
</style>
</head>
<body>

<template id="icons">
  <!-- Thin outline icons drawn for this post (64x64 grid). -->
  <svg data-icon="laptop" viewBox="0 0 64 64"><rect x="11" y="13" width="42" height="29" rx="3"/><path class="fill-accent" d="M15 36c8-10 18 2 34-14v14z" stroke="none"/><path d="M5 47h54l-4 5H9z"/></svg>
  <svg data-icon="coffee" viewBox="0 0 64 64"><path d="M36 14l5-11"/><path d="M19 15h26l2 6H17z"/><path d="M19 21l3 35h20l3-35"/><path class="fill-accent" d="M21.1 31h21.8l-.9 11H22z"/></svg>
  <svg data-icon="pen" viewBox="0 0 64 64"><path d="M32 56L18 31l7-19h14l7 19z"/><circle cx="32" cy="31" r="4"/><path d="M32 35v21"/><path d="M25 12h14"/><path class="fill-accent" d="M26 6h12v6H26z"/><path d="M6 24h8M50 24h8"/><circle class="fill-light" cx="4" cy="24" r="2.6"/><circle class="fill-light" cx="60" cy="24" r="2.6"/></svg>
  <svg data-icon="phone" viewBox="0 0 64 64"><rect x="19" y="5" width="26" height="54" rx="6"/><path d="M28 10h8"/><circle cx="32" cy="52" r="2"/><path class="fill-accent" d="M23 18h18v24H23z" stroke="none"/><path d="M27 34l4 4 7-9"/></svg>
  <svg data-icon="notebook" viewBox="0 0 64 64"><rect x="15" y="7" width="30" height="50" rx="3"/><path d="M10 15h9M10 25h9M10 35h9M10 45h9"/><path d="M24 19h14M24 27h14M24 35h9"/><path d="M53 9v38l-3 6-3-6V9z"/><path class="fill-accent" d="M47 9h6v6h-6z"/></svg>
  <svg data-icon="swatches" viewBox="0 0 64 64"><rect class="fill-surface" x="8" y="10" width="17" height="44" rx="4" transform="rotate(-14 16 54)"/><rect class="fill-teal" x="23" y="8" width="17" height="44" rx="4"/><rect class="fill-accent" x="39" y="10" width="17" height="44" rx="4" transform="rotate(14 48 54)"/><circle cx="31.5" cy="44" r="2.5" class="fill-light"/></svg>
  <svg data-icon="parcel" viewBox="0 0 64 64"><path d="M8 20l24-10 24 10v26L32 56 8 46z"/><path d="M8 20l24 10 24-10"/><path d="M32 30v26"/><path class="fill-accent" d="M18 15.8l24 10V34l-6 2.4V28.3L12 18.3z"/></svg>
</template>

<template id="arrow"><svg viewBox="0 0 40 40"><path d="M8 20h24M22 10l10 10-10 10"/></svg></template>

<script>
  const params = new URLSearchParams(location.search);
  const format = params.get("format") === "feed" ? "feed" : "story";
  const asset = (name) => "../build/" + name;

  // Sticker placements per format: [icon, left, top, size, rotation]
  const layouts = {
    story: {
      person: { src: "ceo-sticker-story.png" },
      stickers: [
        ["laptop",   34,  880, 206, -6],
        ["notebook", 30, 1140, 182,  5],
        ["swatches", 46, 1380, 172, -4],
        ["coffee",  842,  866, 194,  6],
        ["pen",     866, 1124, 176, -5],
        ["phone",   846, 1366, 184,  4],
      ],
      button: { kind: "ghost", text: "hustleacademyja.com" },
    },
    feed: {
      person: { src: "ceo-sticker-feed.png" },
      stickers: [
        ["laptop",   46,  560, 176, -6],
        ["swatches", 40,  796, 150,  5],
        ["notebook", 58,  996, 126, -4],
        ["coffee",  866,  548, 164,  6],
        ["pen",     884,  786, 150, -5],
        ["phone",   880,  990, 130,  5],
      ],
      button: { kind: "solid", text: "Join the community" },
    },
  };

  const L = layouts[format];
  const post = document.createElement("div");
  post.className = "post " + format;
  post.innerHTML = `
    <div class="header"><img src="../source/ha-badge.png" alt="Hustle Academy badge"><span class="wordmark">Hustle Academy JA</span></div>
    <div class="title">
      <h1 class="hook"><span class="lead">Meet our</span><span class="big">CEO</span></h1>
      <div class="role"><span class="and">and</span> Creative Design Manager</div>
    </div>`;

  const person = document.createElement("img");
  person.className = "person";
  person.src = asset(L.person.src);
  person.alt = "Hustle Academy CEO and Creative Design Manager";
  post.appendChild(person);

  const icons = document.getElementById("icons").content;
  for (const [name, left, top, size, rot] of L.stickers) {
    const s = document.createElement("div");
    s.className = "sticker";
    Object.assign(s.style, { left: left + "px", top: top + "px", width: size + "px", height: size + "px", transform: `rotate(${rot}deg)` });
    s.appendChild(icons.querySelector(`[data-icon="${name}"]`).cloneNode(true));
    post.appendChild(s);
  }

  const fade = document.createElement("div");
  fade.className = "fade";
  post.appendChild(fade);

  const btn = document.createElement("div");
  btn.className = "button " + L.button.kind;
  btn.textContent = L.button.text;
  btn.appendChild(document.getElementById("arrow").content.cloneNode(true));
  post.appendChild(btn);

  document.body.appendChild(post);
</script>
</body>
</html>
