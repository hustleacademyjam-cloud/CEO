<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story Highlights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens from the Hustle Academy Social design system (dark theme). */
  :root {
    --surface: #0a3c48;
    --surface-glow: #0d4c59;
    --surface-deep: #052a33;
    --surface-raised: #0f4854;
    --surface-light: #ebf5f7;
    --ink: #ffffff;
    --ink-muted: #a9c3ca;
    --ink-light: #0b3b4a;
    --ink-light-muted: #55696f;
    --border: #114c58;
    --border-light: #d3e4e8;
    --accent: #f5c13a;
    --brand-teal: #08808e;
    --display: Fraunces, Georgia, serif;
    --body: Inter, ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--surface-deep); }

  .post {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    color: var(--ink); font-family: var(--body);
    background:
      radial-gradient(ellipse 80% 45% at 50% 0%, var(--surface-glow) 0%, rgba(13, 76, 89, 0) 100%),
      linear-gradient(180deg, var(--surface-glow) 0%, var(--surface) 50%, var(--surface-deep) 100%);
  }

  .header { position: absolute; top: 210px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 28px; }
  .header img { width: 88px; height: 88px; border-radius: 50%; display: block; }
  .wordmark { font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 6px; text-transform: uppercase; }

  .title { position: absolute; top: 352px; left: 64px; right: 64px; text-align: center; }
  .hook { font-family: var(--display); font-weight: 900; font-variation-settings: "opsz" 9; text-transform: uppercase; line-height: 0.96; }
  .hook span { display: block; white-space: nowrap; }
  .hook .fit { display: block; width: max-content; margin: 0 auto; }
  .hook .accent { color: var(--accent); }
  .sub { font-size: 40px; line-height: 1.32; color: var(--ink-muted); margin-top: 22px; }
  .tag {
    display: inline-flex; align-items: center; height: 60px; padding: 0 28px; border-radius: 9999px;
    border: 2px solid rgba(255, 255, 255, 0.55); font-weight: 700; font-size: 24px; letter-spacing: 5px; text-transform: uppercase;
    margin-bottom: 26px;
  }
  .tag b { color: var(--accent); font-weight: 700; margin-right: 14px; }

  .button {
    white-space: pre; position: absolute; z-index: 3; left: 250px; right: 250px; bottom: 340px; height: 92px; border-radius: 9999px;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    font-weight: 800; font-size: 34px; letter-spacing: -1.2px;
  }
  .button.solid { background: #ffffff; color: var(--ink-light); }
  .button.ghost { border: 2px solid rgba(255, 255, 255, 0.85); color: #ffffff; background: rgba(5, 42, 51, 0.6); }
  .button svg { width: 36px; height: 36px; }
  .button svg path { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- FAQ tweet cards ---- */
  .threads { position: absolute; left: 64px; right: 64px; display: flex; flex-direction: column; gap: 36px; }
  .thread { display: flex; flex-direction: column; gap: 18px; }
  .tweet { position: relative; border-radius: 32px; padding: 24px 30px 24px; display: grid; grid-template-columns: 72px 1fr; column-gap: 22px; }
  .tweet .avatar { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; }
  .tweet .avatar img { width: 100%; height: 100%; display: block; }
  .tweet .meta { display: flex; align-items: baseline; gap: 12px; font-size: 27px; line-height: 1.2; white-space: nowrap; }
  .tweet .name { font-weight: 800; }
  .tweet .handle { font-weight: 500; }
  .tweet .text { font-size: 31px; line-height: 1.28; font-weight: 500; margin-top: 8px; }
  .tweet .replying { font-size: 24px; font-weight: 500; margin-top: 4px; }
  .tweet .actions { display: flex; gap: 64px; margin-top: 14px; }
  .tweet .actions svg { width: 28px; height: 28px; }
  .tweet .actions svg * { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .tweet.ask { background: rgba(255, 255, 255, 0.08); border: 1.5px solid rgba(255, 255, 255, 0.22); color: var(--ink); margin-right: 60px; }
  .tweet.ask .avatar { background: rgba(255, 255, 255, 0.14); color: var(--ink-muted); }
  .tweet.ask .avatar svg { width: 40px; height: 40px; }
  .tweet.ask .avatar svg * { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .tweet.ask .handle { color: var(--ink-muted); }
  .tweet.ask .text { font-weight: 600; }
  /* speech-bubble tail on questions */
  .tweet.ask::after {
    content: ""; position: absolute; left: 54px; bottom: -17px; width: 30px; height: 30px; transform: rotate(45deg);
    background: #0c4652; border-right: 1.5px solid rgba(255, 255, 255, 0.22); border-bottom: 1.5px solid rgba(255, 255, 255, 0.22);
  }

  .tweet.answer { background: #ffffff; color: var(--ink-light); margin-left: 60px; box-shadow: 0 0 0 12px rgba(235, 245, 247, 0.16), 0 30px 60px -28px rgba(0, 0, 0, 0.5); }
  .tweet.answer .handle, .tweet.answer .actions { color: var(--ink-light-muted); }
  .tweet.answer .replying { color: var(--brand-teal); }
  .tweet.answer .text b { color: var(--brand-teal); font-weight: 800; }

  /* FAQ cover: floating question bubbles */
  .cover-qs .tweet.ask { margin: 0; position: absolute; width: 700px; }
  .cover-qs .tweet.ask:nth-child(odd) { left: 0; }
  .cover-qs .tweet.ask:nth-child(even) { right: 0; }
  .cover-qs .tweet.ask::after { display: none; }

  /* ---- Highlight covers (Instagram crops to the centre circle) ---- */
  .hl-ring {
    position: absolute; left: 50%; top: 50%; width: 620px; height: 620px; transform: translate(-50%, -50%);
    border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
    border: 6px solid var(--accent);
  }
  .hl-ring svg { width: 300px; height: 300px; }
  .hl-ring svg * { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .hl-ring svg text { fill: var(--accent); stroke: none; font-family: var(--display); font-weight: 900; font-variation-settings: "opsz" 9; }

  /* ---- Meet the team poster: badge hub with orbiting stickers ---- */
  .orbit { position: absolute; border-radius: 50%; border: 3px dashed rgba(255, 255, 255, 0.28); }
  .hub {
    position: absolute; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 14px #ebf5f7, 0 0 0 40px rgba(235, 245, 247, 0.16), 0 40px 70px -30px rgba(0, 0, 0, 0.7);
  }
  .hub img { width: 100%; height: 100%; display: block; }
  .sticker {
    position: absolute; z-index: 2; display: grid; place-items: center;
    background: var(--surface-light); border-radius: 34px; color: var(--brand-teal);
    box-shadow: 0 0 0 14px rgba(235, 245, 247, 0.22), 0 24px 40px -22px rgba(0, 0, 0, 0.55);
  }
  .sticker svg { width: 64%; height: 64%; overflow: visible; }
  .sticker svg * { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .sticker svg .fill-accent { fill: var(--accent); }
  .sticker svg .fill-teal { fill: var(--brand-teal); }
  .sticker svg .fill-surface { fill: var(--surface); }
  .sticker svg .fill-light { fill: #ffffff; }
  .spark { position: absolute; width: 44px; height: 44px; }
  .spark path { fill: var(--accent); }
</style>
</head>
<body>

<template id="icons">
  <!-- Thin outline icons drawn for this post (64x64 grid). -->
  <svg data-icon="laptop" viewBox="0 0 64 64"><rect x="11" y="13" width="42" height="29" rx="3"/><path class="fill-accent" d="M15 36c8-10 18 2 34-14v14z" stroke="none"/><path d="M5 47h54l-4 5H9z"/></svg>
  <svg data-icon="coffee" viewBox="0 0 64 64"><path d="M36 14l5-11"/><path d="M19 15h26l2 6H17z"/><path d="M19 21l3 35h20l3-35"/><path class="fill-accent" d="M21.1 31h21.8l-.9 11H22z"/></svg>
  <svg data-icon="pen" viewBox="0 0 64 64"><path d="M32 56L18 31l7-19h14l7 19z"/><circle cx="32" cy="31" r="4"/><path d="M32 35v21"/><path d="M25 12h14"/><path class="fill-accent" d="M26 6h12v6H26z"/><path d="M6 24h8M50 24h8"/><circle class="fill-light" cx="4" cy="24" r="2.6"/><circle class="fill-light" cx="60" cy="24" r="2.6"/></svg>
  <svg data-icon="phone" viewBox="0 0 64 64"><rect x="19" y="5" width="26" height="54" rx="6"/><path d="M28 10h8"/><circle cx="32" cy="52" r="2"/><path class="fill-accent" d="M23 18h18v24H23z" stroke="none"/><path d="M27 34l4 4 7-9"/></svg>
  <svg data-icon="notebook" viewBox="0 0 64 64"><rect x="15" y="7" width="30" height="50" rx="3"/><path d="M10 15h9M10 25h9M10 35h9M10 45h9"/><path d="M24 19h14M24 27h14M24 35h9"/><path d="M53 9v38l-3 6-3-6V9z"/><path class="fill-accent" d="M47 9h6v6h-6z"/></svg>
  <svg data-icon="swatches" viewBox="0 0 64 64"><rect class="fill-surface" x="8" y="10" width="17" height="44" rx="4" transform="rotate(-14 16 54)"/><rect class="fill-teal" x="23" y="8" width="17" height="44" rx="4"/><rect class="fill-accent" x="39" y="10" width="17" height="44" rx="4" transform="rotate(14 48 54)"/><circle cx="31.5" cy="44" r="2.5" class="fill-light"/></svg>
  <svg data-icon="parcel" viewBox="0 0 64 64"><path d="M8 20l24-10 24 10v26L32 56 8 46z"/><path d="M8 20l24 10 24-10"/><path d="M32 30v26"/><path class="fill-accent" d="M18 15.8l24 10V34l-6 2.4V28.3L12 18.3z"/></svg>
</template>

<template id="arrow"><svg viewBox="0 0 40 40"><path d="M8 20h24M22 10l10 10-10 10"/></svg></template>
<template id="person-icon"><svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7"/><path d="M7 35c1.5-7 6.5-10 13-10s11.5 3 13 10"/></svg></template>
<template id="actions"><div class="actions">
  <svg viewBox="0 0 32 32"><path d="M6 8h20a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H15l-6 5v-5H6a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z"/></svg>
  <svg viewBox="0 0 32 32"><path d="M7 13l4-4 4 4M11 9v12a3 3 0 0 0 3 3h6M25 19l-4 4-4-4M21 23V11a3 3 0 0 0-3-3h-6"/></svg>
  <svg viewBox="0 0 32 32"><path d="M16 27S4 20 4 12a6 6 0 0 1 12-2 6 6 0 0 1 12 2c0 8-12 15-12 15z"/></svg>
  <svg viewBox="0 0 32 32"><path d="M16 4v17M9 11l7-7 7 7M5 20v6a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2v-6"/></svg>
</div></template>

<script>
  // Services, prices and lines from the design system's offers page (hustleacademyja.com, read 4 Oct 2026). Prices are USD.
  const BRAND = { name: "Hustle Academy JA", handle: "hustleacademyja.com", logo: "../source/ha-badge.png" };
  const ASKER = { name: "You asked", handle: "@follower" };

  const faq = [
    { title: ["Brand", "services"], qa: [
      ["Do you build websites for businesses?", "Yes. Three website packages: <b>Starter US$150</b>, <b>Growth US$250</b> and <b>Premium US$500</b>."],
      ["Can you help me with my branding?", "Yes. Our brand kits come in two sizes: <b>Essentials US$120</b> and <b>Complete US$250</b>."],
    ]},
    { title: ["Bundles &", "booking"], qa: [
      ["Can I get a website and a brand kit together?", "Yes, and a bundle saves you money: <b>Launch US$240</b> (save US$30), <b>Growth US$430</b> (save US$70), <b>Premium US$650</b> (save US$100)."],
      ["How do I start a project?", "Pay a <b>50% deposit</b> and we get to work. Add-ons start from <b>US$25</b>. Tap Start a project at hustleacademyja.com."],
    ]},
    { title: ["Learn", "with us"], qa: [
      ["What's in the Playbook?", "The China to Jamaica E-Commerce Playbook, <b>US$70</b>, instant access: product research, sourcing, importing, landed costs, pricing, branding and launch."],
      ["How does the 4-Week Intensive work?", "A live cohort: 2 classes a week, 8 sessions of 30 to 60 minutes. <b>US$100 one-time</b>. Every application is reviewed personally."],
    ]},
    { title: ["Mentorship &", "suppliers"], qa: [
      ["Can I get 1-on-1 help with my business?", "Yes. <b>1-on-1 Mentorship is US$160</b>: assessment, sourcing strategy, pricing review, launch strategy and an action plan. Guidance only."],
      ["Do you sell supplier lists?", "Yes, PDF lists of China-based vendors by category. <b>Hair &amp; Wigs US$70</b>, every other category <b>US$50</b>. Vendors are vetted; still do your own checks."],
    ]},
    { title: ["Good to", "know"], qa: [
      ["Are your prices in JMD?", "No. All of our prices are in <b>US dollars</b>."],
      ["Will I make money if I join?", "We give education, guidance, resources and community. <b>No guaranteed income</b>, profits, sales or success. Results depend on your own effort."],
    ], button: { kind: "solid", text: "Start a project" } },
  ];

  const tpl = (id) => document.getElementById(id).content.cloneNode(true);
  const params = new URLSearchParams(location.search);
  const slide = params.get("slide") || "team";

  // Shrink any .fit line so it never wraps and stays inside the 952px content width.
  function fit(p) {
    for (const el of p.querySelectorAll(".fit")) {
      const max = 952, w = el.scrollWidth;
      if (w > max) el.style.fontSize = parseFloat(el.style.fontSize) * max / w + "px";
    }
  }

  function post() {
    const p = document.createElement("div");
    p.className = "post";
    document.body.appendChild(p);
    return p;
  }
  function header(p) {
    p.insertAdjacentHTML("beforeend", `<div class="header"><img src="${BRAND.logo}" alt=""><span class="wordmark">${BRAND.name}</span></div>`);
  }
  function button(p, { kind, text }) {
    const b = document.createElement("div");
    b.className = "button " + kind;
    b.textContent = text;
    b.appendChild(tpl("arrow"));
    p.appendChild(b);
  }
  function ask(text) {
    const t = document.createElement("div");
    t.className = "tweet ask";
    t.innerHTML = `<div class="avatar"></div><div><div class="meta"><span class="name">${ASKER.name}</span><span class="handle">${ASKER.handle}</span></div><div class="text">${text}</div></div>`;
    t.querySelector(".avatar").appendChild(tpl("person-icon"));
    return t;
  }
  function answer(text) {
    const t = document.createElement("div");
    t.className = "tweet answer";
    t.innerHTML = `<div class="avatar"><img src="${BRAND.logo}" alt=""></div><div><div class="meta"><span class="name">${BRAND.name}</span><span class="handle">${BRAND.handle}</span></div><div class="replying">Replying to ${ASKER.handle}</div><div class="text">${text}</div></div>`;
    t.querySelector(".text").after(tpl("actions"));
    return t;
  }

  // Lay out only once the brand fonts are in, so fitted headlines are measured in Fraunces.
  Promise.all(["900 100px Fraunces", "500 31px Inter", "800 31px Inter"].map((f) => document.fonts.load(f))).then(build);

  function build() {
  if (slide === "team") {
    const p = post();
    header(p);
    p.insertAdjacentHTML("beforeend", `<div class="title"><h1 class="hook"><span style="font-size:112px;letter-spacing:2px">Meet the</span><span class="accent" style="font-size:300px;line-height:0.84">Team</span></h1><p class="sub">The people behind Hustle Academy JA.</p></div>`);
    // Badge at the centre, the team's tools orbiting it.
    const cx = 540, cy = 1150, r = 300, hub = 300, size = 150;
    p.insertAdjacentHTML("beforeend", `<div class="orbit" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px"></div>
      <div class="hub" style="left:${cx - hub / 2}px;top:${cy - hub / 2}px;width:${hub}px;height:${hub}px"><img src="${BRAND.logo}" alt=""></div>`);
    const icons = document.getElementById("icons").content;
    const orbit = [["laptop", -140, -6], ["pen", -40, 5], ["coffee", 0, 6], ["phone", 38, -4], ["swatches", 142, 5], ["notebook", 180, -5]];
    for (const [name, deg, rot] of orbit) {
      const a = deg * Math.PI / 180, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      const el = document.createElement("div");
      el.className = "sticker";
      Object.assign(el.style, { left: x - size / 2 + "px", top: y - size / 2 + "px", width: size + "px", height: size + "px", transform: `rotate(${rot}deg)` });
      el.appendChild(icons.querySelector(`[data-icon="${name}"]`).cloneNode(true));
      p.appendChild(el);
    }
    const star = '<svg class="spark" viewBox="0 0 44 44" style="left:%Xpx;top:%Ypx;transform:scale(%S)"><path d="M22 0c1.6 11 9.4 18.8 22 22-12.6 3.2-20.4 11-22 22-1.6-11-9.4-18.8-22-22C12.6 18.8 20.4 11 22 0z"/></svg>';
    for (const [x, y, sc] of [[150, 860, 1], [900, 880, 0.7], [300, 1420, 0.6], [800, 1430, 0.9]])
      p.insertAdjacentHTML("beforeend", star.replace("%X", x).replace("%Y", y).replace("%S", sc));
    button(p, { kind: "ghost", text: "Tap to meet us" });
  }

  if (slide === "faq-cover") {
    const p = post();
    header(p);
    p.insertAdjacentHTML("beforeend", `<div class="title"><div class="tag"><b>FAQ</b>Services &amp; programs</div><h1 class="hook"><span class="fit" style="font-size:150px">You asked,</span><span class="fit accent" style="font-size:150px">we answered</span></h1></div>`);
    fit(p);
    const qs = document.createElement("div");
    qs.className = "threads cover-qs";
    Object.assign(qs.style, { top: "800px", height: "640px" });
    const picks = ["Do you build websites?", "Can you design my brand?", "Do you have bundles?", "Do you sell supplier lists?"];
    picks.forEach((q, i) => {
      const t = ask(q);
      Object.assign(t.style, { top: i * 168 + "px", transform: `rotate(${[-2, 1.6, -1.4, 2][i]}deg)` });
      qs.appendChild(t);
    });
    p.appendChild(qs);
    button(p, { kind: "ghost", text: "Tap for answers" });
  }

  const m = slide.match(/^faq-(\d)$/);
  if (m) {
    const i = Number(m[1]) - 1, s = faq[i];
    const p = post();
    header(p);
    p.insertAdjacentHTML("beforeend", `<div class="title"><h1 class="hook"><span class="fit" style="font-size:100px">${s.title[0]} <span class="accent" style="display:inline">${s.title[1]}</span></span></h1></div>`);
    fit(p);
    const th = document.createElement("div");
    th.className = "threads";
    for (const [q, a] of s.qa) {
      const t = document.createElement("div");
      t.className = "thread";
      t.append(ask(q), answer(a));
      th.appendChild(t);
    }
    p.appendChild(th);
    th.style.top = p.querySelector(".title").getBoundingClientRect().bottom + 44 + "px";
    const count = `FAQ ${String(i + 1).padStart(2, "0")} / ${String(faq.length).padStart(2, "0")}`;
    button(p, s.button || { kind: "ghost", text: `${count}  ·  Next` });
  }

  if (slide === "cover-team" || slide === "cover-faq") {
    const p = post();
    const icon = slide === "cover-team"
      ? `<svg viewBox="0 0 64 64"><circle cx="22" cy="22" r="8"/><circle cx="44" cy="24" r="6.5"/><path d="M6 50c1.5-10 8-15 16-15s14.5 5 16 15"/><path d="M36 37.5c2.2-1.3 4.9-2 8-2 6.5 0 11.5 4 13 12"/></svg>`
      : `<svg viewBox="0 0 64 64"><path d="M12 10h40a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H30l-12 10V44h-6a6 6 0 0 1-6-6V16a6 6 0 0 1 6-6z"/><text x="32" y="36" text-anchor="middle" font-size="26">?</text></svg>`;
    p.insertAdjacentHTML("beforeend", `<div class="hl-ring">${icon}</div>`);
  }
  document.body.dataset.ready = "1";
  }
</script>
</body>
</html>
